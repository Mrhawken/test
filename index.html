<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yew App</title>
    
    <!-- Ladda din Yew app: script och WASM-filer -->
    <script type="module">
        import init, * as bindings from './my-yew-app-f4147f391f5ad987.js'; 
        const wasm = await init({ module_or_path: './my-yew-app-f4147f391f5ad987_bg.wasm' });

        window.wasmBindings = bindings;

        dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
    </script>

    <!-- Preload script och wasm-filer -->
    <link rel="modulepreload" href="./my-yew-app-f4147f391f5ad987.js" crossorigin="anonymous">
    <link rel="preload" href="./my-yew-app-f4147f391f5ad987_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm">
</head>
<body>
    <!-- Din applikation kommer att renderas här -->
    <main>
        <h1>Välkommen till Yew App</h1>
        <p>Detta är en Yew-baserad app som du kan använda för att demonstrera WebAssembly i en webbmiljö.</p>
    </main>

    <script>
        "use strict";

        // Här kan du hantera andra funktioner i din app, om så behövs
        (function () {

            const address = '{{__TRUNK_ADDRESS__}}';  // Byt ut med rätt adress om behövs
            const base = '{{__TRUNK_WS_BASE__}}';     // Byt ut med rätt base URL om behövs
            let protocol = '';
            protocol = protocol
                ? protocol
                : window.location.protocol === 'https:'
                    ? 'wss'
                    : 'ws';
            const url = protocol + '://' + address + base + '.well-known/trunk/ws';

            // Hantering av WebSocket för applikationen
            class Overlay {
                constructor() {
                    // Skapa en overlay om det behövs
                    this._overlay = document.createElement("div");
                    const style = this._overlay.style;
                    style.height = "100vh";
                    style.width = "100vw";
                    style.position = "fixed";
                    style.top = "0";
                    style.left = "0";
                    style.backgroundColor = "rgba(222, 222, 222, 0.5)";
                    style.fontFamily = "sans-serif";
                    style.zIndex = "1000000";
                    style.backdropFilter = "blur(1rem)";

                    const container = document.createElement("div");
                    container.style.position = "absolute";
                    container.style.top = "30%";
                    container.style.left = "15%";
                    container.style.maxWidth = "85%";

                    this._title = document.createElement("div");
                    this._title.innerText = "Byggfel";
                    this._title.style.paddingBottom = "2rem";
                    this._title.style.fontSize = "2.5rem";

                    this._message = document.createElement("div");
                    this._message.style.whiteSpace = "pre-wrap";

                    const icon = document.createElement("div");
                    icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
                    this._title.prepend(icon);

                    container.append(this._title, this._message);
                    this._overlay.append(container);

                    this._inject();
                    window.setInterval(() => {
                        this._inject();
                    }, 250);
                }

                set reason(reason) {
                    this._message.textContent = reason;
                }

                _inject() {
                    if (!this._overlay.isConnected) {
                        document.body?.prepend(this._overlay);
                    }
                }
            }

            class Client {
                constructor(url) {
                    this.url = url;
                    this.poll_interval = 5000;
                    this._overlay = null;
                }

                start() {
                    const ws = new WebSocket(this.url);
                    ws.onmessage = (ev) => {
                        const msg = JSON.parse(ev.data);
                        switch (msg.type) {
                            case "reload":
                                this.reload();
                                break;
                            case "buildFailure":
                                this.buildFailure(msg.data)
                                break;
                        }
                    };
                    ws.onclose = () => this.onclose();
                }

                onclose() {
                    window.setTimeout(() => {
                        const ws = new WebSocket(this.url);
                        ws.onopen = () => window.location.reload();
                        ws.onclose = () => this.onclose();
                    }, this.poll_interval);
                }

                reload() {
                    window.location.reload();
                }

                buildFailure({reason}) {
                    console.error("Byggfel:", reason);
                    if (!this._overlay) {
                        this._overlay = new Overlay();
                    }
                    this._overlay.reason = reason;
                }
            }

            new Client(url).start();

        })();
    </script>
</body>
</html>
